{% extends 'food/base.html' %}

{% block body %}

<div class="container">
    <div class="row">
        <div class="col-md-4">
            <img src="{{ item.item_image }}" class="card" style="width: 200px; height: 200px; object-fit: cover;"/>
        </div>

        <div>
            <h1> {{ object.item_name}}  </h1>
            <h2> {{ object.item_des}} </h2>
            <h3> ${{ object.item_price}} </h3>
            {% if request.user.is_superuser %}
                <a href="{% url 'food:delete_item' item.id %}" class="btn btn-danger">Delete</a>
            {% endif %}
        </div>
    </div>
</div>

{% endblock %}
